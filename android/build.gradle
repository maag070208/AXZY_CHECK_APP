buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Android 16 KB page size: op-sqlite compila SQLCipher desde fuente.
// NDK 27 no aplica 16 KB por defecto; forzamos el segmento LOAD a 16 KB.
subprojects { subproject ->
    if (subproject.name == "op-engineering_op-sqlite" || subproject.name == "op-sqlite") {
        subproject.plugins.withId("com.android.library") {
            subproject.android.defaultConfig.externalNativeBuild.cmake.arguments +=
                "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
        }
    }
}
