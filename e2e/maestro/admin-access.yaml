appId: com.axzy.checkapp.barcelona
---
# Fase 2A: avisos, vehículos y bitácora desde la administración.
- launchApp:
    clearState: true
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: "Iniciar sesión"
    timeout: 30000
- tapOn: "Usuario"
- inputText: "isabel"
- tapOn: "Contraseña"
- inputText: "123456"
- hideKeyboard
- tapOn:
    text: "Iniciar sesión"
    index: 1
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: ".*, Isabel"
    timeout: 30000

# Vehículos
- tapOn: "Abrir menú"
- scrollUntilVisible:
    element:
      text: "Vehículos"
- tapOn:
    text: "Vehículos"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Consulta de vehículos"
    timeout: 15000
- pressKey: Back
