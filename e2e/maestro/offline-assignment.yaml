appId: com.axzy.checkapp.barcelona
---
# Sin red: asignación especial con checklist, salir y cerrar la APP, retomar y guardar.
- launchApp
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Escanear"
    direction: DOWN
    timeout: 30000
- tapOn: "Escanear"
- extendedWaitUntil:
    visible: "E2E: simular escaneo"
    timeout: 15000
- tapOn: "E2E: simular escaneo"
- extendedWaitUntil:
    visible: "TAREAS DEL PUNTO"
    timeout: 20000
- assertVisible: "0/2 completadas"
# Marca una tarea, escribe y cierra la APP sin guardar: el borrador debe sobrevivir.
- tapOn: "Revisar candado E2E"
- extendedWaitUntil:
    visible: "1/2 completadas"
    timeout: 10000
- tapOn: "Escribe los detalles de la revisión..."
- inputText: "Asignacion sin WiFi"
- hideKeyboard
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Escanear"
    direction: DOWN
    timeout: 30000
- tapOn: "Escanear"
- extendedWaitUntil:
    visible: "E2E: simular escaneo"
    timeout: 15000
- tapOn: "E2E: simular escaneo"
- extendedWaitUntil:
    visible: "TAREAS DEL PUNTO"
    timeout: 20000
- assertVisible: "Asignacion sin WiFi"
- tapOn: "Revisar candado E2E"
- tapOn: "Revisar luces E2E"
- extendedWaitUntil:
    visible: "2/2 completadas"
    timeout: 10000
- swipe:
    start: 50%, 80%
    end: 50%, 45%
    duration: 400
- tapOn: "Añadir"
- extendedWaitUntil:
    visible: "CÁMARA LISTA"
    timeout: 20000
- tapOn: "Tomar foto"
- extendedWaitUntil:
    notVisible: "CÁMARA LISTA"
    timeout: 20000
- tapOn: "Guardar reporte"
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 30000
