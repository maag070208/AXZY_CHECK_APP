appId: com.axzy.checkapp.barcelona
---
# Se ejecuta con WiFi/datos apagados y la app ya logueada.
- launchApp
- extendedWaitUntil:
    visible: ".*Sin conexión.*"
    timeout: 30000
- assertVisible: ".*Sin conexión.*"

# Un mantenimiento offline NO debe iniciar una ronda.
- runFlow: maintenance.yaml
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 20000

# Ronda offline: confirmación obligatoria, inicio y cierre.
- tapOn: "Iniciar ronda"
- extendedWaitUntil:
    visible: "Iniciar Recorrido"
    timeout: 15000
- tapOn:
    text: "^Iniciar$"
- extendedWaitUntil:
    visible: "Ronda en curso"
    timeout: 20000
- tapOn: "Terminar ronda"
- extendedWaitUntil:
    visible: "¿Finalizar Ronda?"
    timeout: 15000
- tapOn:
    text: "^Finalizar$"
- extendedWaitUntil:
    visible: "¡Ronda completada!"
    timeout: 30000
- tapOn: "Entendido"
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 20000
