appId: com.axzy.checkapp.barcelona
---
# Pase QR personal: activar, mostrar, abrir el diálogo de desactivar y cancelar.
- launchApp:
    clearState: true
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: "Iniciar sesión"
    timeout: 30000
- tapOn: "Usuario"
- inputText: "e2e_resident"
- tapOn: "Contraseña"
- inputText: "123456"
- hideKeyboard
- tapOn:
    text: "Iniciar sesión"
    index: 1
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: ".*tus accesos.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Mi pase QR"
- tapOn: "Mi pase QR"
- extendedWaitUntil:
    visible: "Mi pase QR"
    timeout: 15000
- runFlow:
    when:
      visible: "Activar mi pase QR"
    commands:
      - tapOn: "Activar mi pase QR"
- extendedWaitUntil:
    visible: "Se renueva en.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Presenta este QR en caseta de seguridad"
- scrollUntilVisible:
    element:
      text: "Desactivar"
- tapOn: "Desactivar"
- extendedWaitUntil:
    visible: "Desactivar mi pase QR"
    timeout: 10000
- assertVisible: ".*dejará de funcionar.*"
- tapOn: "Cancelar"
- pressKey: Back
