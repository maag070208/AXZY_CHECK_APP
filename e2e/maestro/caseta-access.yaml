appId: com.axzy.checkapp.barcelona
---
# Fase 2A: accesos de caseta desde las acciones rápidas del guardia.
- launchApp:
    clearState: true
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: "Iniciar sesión"
    timeout: 30000
- tapOn: "Usuario"
- inputText: "marcoh"
- tapOn: "Contraseña"
- inputText: "123456"
- hideKeyboard
- tapOn:
    text: "Iniciar sesión"
    index: 1
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 30000

# Vehículos
- scrollUntilVisible:
    element:
      text: "Vehículos"
- tapOn: "Vehículos"
- extendedWaitUntil:
    visible: "Consulta de vehículos"
    timeout: 15000
- assertVisible: "Busca por placa o tag y registra el acceso manual. Sin lector físico todavía."
- pressKey: Back
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 15000

# Clave peatonal
- scrollUntilVisible:
    element:
      text: "Clave peatonal"
- tapOn: "Clave peatonal"
- extendedWaitUntil:
    visible: "Validar clave peatonal"
    timeout: 15000
- assertVisible: ".*La puerta se abre manualmente.*"
- pressKey: Back
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 15000

# Pase QR personal
- scrollUntilVisible:
    element:
      text: "Pase QR"
- tapOn: "Pase QR"
- extendedWaitUntil:
    visible: "Pase personal del residente"
    timeout: 15000
- pressKey: Back
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 15000
