appId: com.axzy.checkapp.barcelona
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "E2E: simular escaneo"
    timeout: 30000
# Escanea E2E-02, toma foto y sale sin guardar.
- tapOn: "E2E: simular escaneo"
- extendedWaitUntil:
    visible: "Escaneo E2E"
    timeout: 15000
- tapOn:
    text: ".*E2E-02.*"
- extendedWaitUntil:
    visible: "E2E-02"
    timeout: 15000
- swipe:
    start: 50%, 80%
    end: 50%, 55%
    duration: 400
- tapOn: "Añadir"
- extendedWaitUntil:
    visible: "CÁMARA LISTA"
    timeout: 20000
- tapOn: "Tomar foto"
- extendedWaitUntil:
    notVisible: "CÁMARA LISTA"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Subiendo evidencias..."
    timeout: 60000
- pressKey: Back
- extendedWaitUntil:
    visible: "¿Salir del reporte?"
    timeout: 15000
- tapOn:
    text: "^Salir$"
- extendedWaitUntil:
    visible: "Ronda en curso"
    timeout: 20000
- tapOn: "E2E: simular escaneo"
- extendedWaitUntil:
    visible: ".*E2E-02.*No completada.*"
    timeout: 15000
- pressKey: Back
