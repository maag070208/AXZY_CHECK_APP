appId: com.axzy.checkapp.barcelona
---
# Inicia la ruta fixture de 8 puntos.
- tapOn: "Iniciar ronda"
- waitForAnimationToEnd
# Con una sola ruta libre la APP pasa directo a la confirmación.
- runFlow:
    when:
      visible: "Selecciona una Ruta"
    commands:
      - tapOn: "8 ubicaciones registradas"
- extendedWaitUntil:
    visible: "Iniciar Recorrido"
    timeout: 15000
- tapOn:
    text: "^Iniciar$"
- extendedWaitUntil:
    visible: "Ronda en curso"
    timeout: 20000
- assertVisible: "E2E: simular escaneo"
