appId: com.checkapp
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "E2E: simular escaneo"
    timeout: 30000
# Escanea E2E-01, sale sin guardar: debe quedar NOT_COMPLETED.
- tapOn: "E2E: simular escaneo"
- extendedWaitUntil:
    visible: "Escaneo E2E"
    timeout: 15000
- tapOn:
    text: ".*E2E-01.*"
- extendedWaitUntil:
    visible: "E2E-01"
    timeout: 15000
- pressKey: Back
- extendedWaitUntil:
    visible: "¿Salir del reporte?"
    timeout: 15000
- tapOn:
    text: "^Salir$"
- extendedWaitUntil:
    visible: "Ronda en curso"
    timeout: 20000
- tapOn: "E2E: simular escaneo"
- extendedWaitUntil:
    visible: ".*E2E-01.*No completada.*"
    timeout: 15000
- pressKey: Back
