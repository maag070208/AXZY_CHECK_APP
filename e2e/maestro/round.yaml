appId: com.checkapp
---
# Ronda: solo iniciar y terminar (sin escanear puntos)
- tapOn: "Iniciar ronda"
- extendedWaitUntil:
    visible: "Ronda en curso"
    timeout: 15000
- tapOn: "Terminar ronda"
- extendedWaitUntil:
    visible: "¿Finalizar Ronda?"
    timeout: 15000
- tapOn: "Finalizar"
- extendedWaitUntil:
    visible: "¡Ronda completada!"
    timeout: 30000
- tapOn: "Entendido"
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 15000
