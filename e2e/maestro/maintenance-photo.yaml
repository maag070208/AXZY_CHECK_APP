appId: com.checkapp
---
# Mantenimiento con una foto, sin video
- tapOn: "Mantenimiento"
- extendedWaitUntil:
    visible: "Nuevo Mantenimiento"
    timeout: 15000
- tapOn: "Baches/Pavimento"
- extendedWaitUntil:
    visible: "3. OBSERVACIONES ADICIONALES"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "Tomar foto"
- extendedWaitUntil:
    visible: "CÁMARA LISTA"
    timeout: 20000
- tapOn: "Tomar foto"
- extendedWaitUntil:
    notVisible: "CÁMARA LISTA"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Subiendo evidencias..."
    timeout: 60000
- swipe:
    start: 50%, 80%
    end: 50%, 65%
    duration: 400
- waitForAnimationToEnd
- tapOn: "ENVIAR REPORTE"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "ENVIAR REPORTE"
      notVisible: "Enviando reporte..."
    commands:
      - tapOn: "ENVIAR REPORTE"
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 30000
