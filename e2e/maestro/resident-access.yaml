appId: com.axzy.checkapp.barcelona
---
# Fase 2A: avisos, clave peatonal, vehículos, accesos y pase QR desde el home.
- launchApp:
    clearState: true
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: "Iniciar sesión"
    timeout: 30000
- tapOn: "Usuario"
- inputText: "e2e_resident"
- tapOn: "Contraseña"
- inputText: "123456"
- hideKeyboard
- tapOn:
    text: "Iniciar sesión"
    index: 1
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: ".*tus accesos.*"
    timeout: 30000

# Avisos (campana)
- tapOn: "Ver avisos"
- extendedWaitUntil:
    visible: "Avisos"
    timeout: 15000
- assertVisible: "Comunicados de la administración."
- pressKey: Back
- extendedWaitUntil:
    visible: ".*tus accesos.*"
    timeout: 15000

# Mi clave peatonal
- scrollUntilVisible:
    element:
      text: "Mi clave peatonal"
- tapOn: "Mi clave peatonal"
- extendedWaitUntil:
    visible: "Mi clave peatonal"
    timeout: 15000
- tapOn:
    text: "Crear mi clave|Cambiar mi clave"
- extendedWaitUntil:
    visible: "Nueva clave peatonal"
    timeout: 15000
- tapOn: "Crear clave"
- extendedWaitUntil:
    visible: "Guarda tus 6 dígitos"
    timeout: 15000
- tapOn: "Entendido"
- pressKey: Back
- extendedWaitUntil:
    visible: ".*tus accesos.*"
    timeout: 15000

# Mis vehículos
- scrollUntilVisible:
    element:
      text: "Mis vehículos"
- tapOn: "Mis vehículos"
- extendedWaitUntil:
    visible: "Mis vehículos"
    timeout: 15000
- assertVisible: "Agregar"
- pressKey: Back
- extendedWaitUntil:
    visible: ".*tus accesos.*"
    timeout: 15000

# Mis accesos
- scrollUntilVisible:
    element:
      text: "Mis accesos"
- tapOn: "Mis accesos"
- extendedWaitUntil:
    visible: "Mis accesos"
    timeout: 15000
- assertVisible: "Entradas y salidas de tu propiedad."
- pressKey: Back
- extendedWaitUntil:
    visible: ".*tus accesos.*"
    timeout: 15000

# Mi pase QR
- scrollUntilVisible:
    element:
      text: "Mi pase QR"
- tapOn: "Mi pase QR"
- extendedWaitUntil:
    visible: "Mi pase QR"
    timeout: 15000
- pressKey: Back
- extendedWaitUntil:
    visible: ".*tus accesos.*"
    timeout: 15000
