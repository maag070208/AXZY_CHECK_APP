appId: com.axzy.checkapp.barcelona
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "E2E: simular escaneo"
    timeout: 30000
# Escanea E2E-04, foto, nota y guarda: COMPLETED.
- tapOn: "E2E: simular escaneo"
- extendedWaitUntil:
    visible: "Escaneo E2E"
    timeout: 15000
- tapOn:
    text: ".*E2E-04.*"
- extendedWaitUntil:
    visible: "E2E-04"
    timeout: 15000
- swipe:
    start: 50%, 80%
    end: 50%, 55%
    duration: 400
- tapOn: "Añadir"
- extendedWaitUntil:
    visible: "CÁMARA LISTA"
    timeout: 20000
- tapOn: "Tomar foto"
- extendedWaitUntil:
    notVisible: "CÁMARA LISTA"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Subiendo evidencias..."
    timeout: 60000
- swipe:
    start: 50%, 80%
    end: 50%, 55%
    duration: 400
- tapOn: "Escribe los detalles de la revisión..."
- inputText: "Punto verificado en E2E"
- hideKeyboard
- tapOn: "Guardar reporte"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Guardar reporte"
    commands:
      - tapOn: "Guardar reporte"
- extendedWaitUntil:
    visible: "Ronda en curso"
    timeout: 30000
- tapOn: "E2E: simular escaneo"
- extendedWaitUntil:
    visible: ".*E2E-04.*Completada.*"
    timeout: 15000
- pressKey: Back
