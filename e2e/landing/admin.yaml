appId: com.axzy.checkapp.barcelona
---
- launchApp:
    clearState: true
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: "Iniciar sesión"
    timeout: 30000
- tapOn: "Usuario"
- inputText: "isabel"
- tapOn: "Contraseña"
- inputText: "123456"
- hideKeyboard
- tapOn:
    text: "Iniciar sesión"
    index: 1
- extendedWaitUntil:
    visible: ".*Isabel.*"
    timeout: 30000
- takeScreenshot: admin-home
- tapOn: "Abrir menú"
- extendedWaitUntil:
    visible: "Residentes"
    timeout: 15000
- takeScreenshot: admin-menu
