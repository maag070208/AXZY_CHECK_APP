appId: com.axzy.checkapp.barcelona
---
- launchApp:
    clearState: true
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: "Iniciar sesión"
    timeout: 30000
- tapOn: "Usuario"
- inputText: "marcoh"
- tapOn: "Contraseña"
- inputText: "123456"
- hideKeyboard
- tapOn:
    text: "Iniciar sesión"
    index: 1
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 30000
- takeScreenshot: guard-home
- scrollUntilVisible:
    element:
      text: "Vehículos"
- tapOn: "Vehículos"
- extendedWaitUntil:
    visible: "Consulta de vehículos"
    timeout: 15000
- takeScreenshot: guard-vehicles
- pressKey: Back
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Clave peatonal"
- tapOn: "Clave peatonal"
- extendedWaitUntil:
    visible: "Validar clave peatonal"
    timeout: 15000
- takeScreenshot: guard-pin
