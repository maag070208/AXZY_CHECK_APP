appId: com.axzy.checkapp.barcelona
---
- tapOn: "Abrir menú"
- extendedWaitUntil:
    visible: "Cerrar Sesión"
    timeout: 10000
- tapOn: "Cerrar Sesión"
- extendedWaitUntil:
    visible: "Iniciar sesión"
    timeout: 15000
- tapOn: "Usuario"
- inputText: "marcoh"
- tapOn: "Contraseña"
- inputText: "123456"
- hideKeyboard
- tapOn:
    text: "Iniciar sesión"
    index: 1
- extendedWaitUntil:
    visible: "Ronda no iniciada"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: guard-home-sync
- tapOn: "Sync"
- extendedWaitUntil:
    visible: "Sincronización"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: guard-sync
