appId: com.axzy.checkapp.barcelona
---
- launchApp:
    clearState: true
- tapOn:
    text: "Nunca en esta aplicación o sitio web"
    optional: true
- extendedWaitUntil:
    visible: "Iniciar sesión"
    timeout: 30000
- tapOn: "Usuario"
- inputText: "e2e_resident"
- tapOn: "Contraseña"
- inputText: "123456"
- hideKeyboard
- tapOn:
    text: "Iniciar sesión"
    index: 1
- extendedWaitUntil:
    visible: ".*tus accesos.*"
    timeout: 30000
- takeScreenshot: resident-home
- tapOn: "Contactos"
- extendedWaitUntil:
    visible: "Mi Agenda"
    timeout: 15000
- takeScreenshot: resident-contacts
- pressKey: Back
- extendedWaitUntil:
    visible: ".*tus accesos.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Mis accesos"
- tapOn: "Mis accesos"
- extendedWaitUntil:
    visible: "Mis accesos"
    timeout: 15000
- takeScreenshot: resident-access
